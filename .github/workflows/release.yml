name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    id-token: write

env:
    GO_VERSION: '1.24'

jobs:
    test:
        name: Test before release
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Run tests
                run: go test -v -race ./...

            -   name: Run linter
                uses: golangci/golangci-lint-action@v8
                with:
                    version: latest
                    args: --timeout=5m

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: test

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Extract version from tag
                id: version
                run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            -   name: Generate changelog
                id: changelog
                run: |
                    if [ -f "CHANGELOG.md" ]; then
                      # Extract changelog for this version
                      sed -n "/^## \[${{ steps.version.outputs.version }}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > temp_changelog.md
                      if [ -s temp_changelog.md ]; then
                        echo "changelog_file=temp_changelog.md" >> $GITHUB_OUTPUT
                      else
                        echo "No changelog found for version ${{ steps.version.outputs.version }}" > temp_changelog.md
                        echo "changelog_file=temp_changelog.md" >> $GITHUB_OUTPUT
                      fi
                    else
                      # Generate changelog from git commits
                      git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" > temp_changelog.md
                      echo "changelog_file=temp_changelog.md" >> $GITHUB_OUTPUT
                    fi

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ steps.version.outputs.version }}
                    name: Release ${{ steps.version.outputs.version }}
                    body_path: ${{ steps.changelog.outputs.changelog_file }}
                    draft: false
                    prerelease: ${{ contains(steps.version.outputs.version, '-') }}
                    generate_release_notes: true

    publish-docs:
        name: Publish Documentation
        runs-on: ubuntu-latest
        needs: release
        if: ${{ !contains(github.ref_name, '-') }} # Only for stable releases

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Generate Go docs
                run: |
                    mkdir -p docs/api
                    go doc -all . > docs/api/goe.md || echo "Documentation generation skipped"

            -   name: Deploy to GitHub Pages
                if: github.repository_owner == 'oeasenet'
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./docs
                    destination_dir: ${{ github.ref_name }}

    notify:
        name: Notify Release
        runs-on: ubuntu-latest
        needs: [ release, publish-docs ]
        if: always()

        steps:
            -   name: Notify on success
                if: needs.release.result == 'success'
                run: |
                    echo "✅ Release ${{ github.ref_name }} created successfully!"

            -   name: Notify on failure
                if: needs.release.result == 'failure'
                run: |
                    echo "❌ Release ${{ github.ref_name }} failed!"
                    exit 1