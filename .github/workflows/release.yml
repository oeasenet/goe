name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    pull-requests: read
    id-token: write

env:
    GO_VERSION: '1.26'

jobs:
    test:
        name: Test before release
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Run tests
                run: go test -race ./...

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: test

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Extract version from tag
                id: version
                run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            -   name: Gather commit log
                id: commits
                run: |
                    # Find the previous tag
                    PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
                    if [ -z "$PREV_TAG" ]; then
                      COMMITS=$(git log --pretty=format:"%h %s" -20)
                    else
                      COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%h %s")
                    fi
                    # Store in file to avoid escaping issues
                    echo "$COMMITS" > commits.txt
                    echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

            -   name: Generate release notes with Claude
                id: release_notes
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    direct_prompt: |
                        You are generating release notes for GOE (Go Enterprise Framework) version ${{ steps.version.outputs.version }}.

                        Previous version: ${{ steps.commits.outputs.prev_tag }}

                        Here are the commits since the last release:
                        $(cat commits.txt)

                        Generate concise, professional release notes in Markdown. Follow this format exactly:

                        ## What's Changed

                        Group changes under these headers (omit empty sections):
                        ### Breaking Changes
                        ### Bug Fixes
                        ### Features
                        ### Performance
                        ### Tests
                        ### Documentation
                        ### Internal

                        Rules:
                        - Each item should be one clear sentence describing the user-facing impact
                        - Reference PR numbers with (#N) when available in commit messages
                        - Skip CI-only changes, merge commits, and trivial changes
                        - For bug fixes, briefly mention what was broken and what's fixed
                        - End with: **Full Changelog**: https://github.com/oeasenet/goe/compare/${{ steps.commits.outputs.prev_tag }}...${{ steps.version.outputs.version }}

                        Output ONLY the Markdown release notes, nothing else.

            -   name: Write release notes to file
                run: |
                    cat << 'RELEASE_EOF' > temp_changelog.md
                    ${{ steps.release_notes.outputs.result }}
                    RELEASE_EOF

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ steps.version.outputs.version }}
                    name: ${{ steps.version.outputs.version }}
                    body_path: temp_changelog.md
                    draft: false
                    prerelease: ${{ contains(steps.version.outputs.version, '-') }}

    publish-docs:
        name: Publish Documentation
        runs-on: ubuntu-latest
        needs: release
        if: ${{ !contains(github.ref_name, '-') }} # Only for stable releases

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v1
                with:
                    bun-version: latest

            -   name: Install dependencies
                run: bun install
                working-directory: docs

            -   name: Build documentation
                run: bun run docs:build
                working-directory: docs

            -   name: Deploy to GitHub Pages
                if: github.repository_owner == 'oeasenet'
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./docs/.vitepress/dist
                    destination_dir: ${{ github.ref_name }}

    notify:
        name: Notify Release
        runs-on: ubuntu-latest
        needs: [ release, publish-docs ]
        if: always()

        steps:
            -   name: Notify on success
                if: needs.release.result == 'success'
                run: |
                    echo "✅ Release ${{ github.ref_name }} created successfully!"

            -   name: Notify on failure
                if: needs.release.result == 'failure'
                run: |
                    echo "❌ Release ${{ github.ref_name }} failed!"
                    exit 1