name: CI

on:
    push:
        branches: [ v2 ]
    pull_request:
        branches: [ v2 ]

env:
    GO_VERSION: '1.26'

jobs:
    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ ubuntu-latest ]
                go-version: [ '1.26' ]

        # Redis for the probed default-lane tests (core/lock, the cache redis
        # driver): they run wherever Redis is reachable and skip where it is
        # not, so providing it here keeps that coverage visible to CI and
        # codecov. Everything that REQUIRES external services stays in the
        # integration lane (make test_integration).
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 15

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Set up Go
                uses: actions/setup-go@v7
                with:
                    go-version: ${{ matrix.go-version }}
                    cache: true

            -   name: Download dependencies
                run: go mod download

            -   name: Verify dependencies
                run: go mod verify

            -   name: Run tests
                run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

            -   name: Upload coverage to Codecov
                if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
                uses: codecov/codecov-action@v7
                with:
                    files: ./coverage.txt
                    token: ${{ secrets.CODECOV_TOKEN }}
                    fail_ci_if_error: false
                    handle_no_reports_found: true

    # Let's not do this for now.
    #    lint:
    #        name: Lint
    #        runs-on: ubuntu-latest
    #
    #        steps:
    #            -   name: Checkout code
    #                uses: actions/checkout@v7
    #
    #            -   name: Set up Go
    #                uses: actions/setup-go@v7
    #                with:
    #                    go-version: ${{ env.GO_VERSION }}
    #                    cache: true
    #
    #            -   name: Run golangci-lint
    #                uses: golangci/golangci-lint-action@v9
    #                with:
    #                    version: latest
    #                    args: --timeout=5m

    check-dependencies:
        name: Check Dependencies
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Set up Go
                uses: actions/setup-go@v7
                with:
                    go-version: ${{ env.GO_VERSION }}
                    cache: true

            -   name: Check for vulnerabilities
                run: |
                    go install golang.org/x/vuln/cmd/govulncheck@latest
                    govulncheck ./...
                continue-on-error: true

            -   name: Check go mod tidy
                run: |
                    go mod tidy
                    git diff --exit-code go.mod go.sum
